name: Diagnose browser
on:
  workflow_dispatch:
    inputs:
      test:
        description: Test path under tests/browser, optionally followed by :line
        required: true
        type: string
      browser:
        description: Browser
        type: choice
        options: [webkit, chromium]
        default: webkit
      repeat:
        description: Repeat count, without retries
        type: choice
        options: ['1', '3', '10']
        default: '1'
permissions:
  contents: read
concurrency:
  group: cms-diagnose-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BLOG_TEST_RUN_ID: diagnostic
      DIAGNOSTIC_TEST: ${{ inputs.test }}
      DIAGNOSTIC_BROWSER: ${{ inputs.browser }}
      DIAGNOSTIC_REPEAT: ${{ inputs.repeat }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the diagnostic selection
        shell: bash
        run: |
          [[ "$DIAGNOSTIC_TEST" =~ ^tests/browser/[a-zA-Z0-9_/-]+\.spec\.ts(:[1-9][0-9]*)?$ ]]
          test -f "${DIAGNOSTIC_TEST%%:*}"
          [[ "$DIAGNOSTIC_BROWSER" == chromium || "$DIAGNOSTIC_BROWSER" == webkit ]]
          [[ "$DIAGNOSTIC_REPEAT" == 1 || "$DIAGNOSTIC_REPEAT" == 3 || "$DIAGNOSTIC_REPEAT" == 10 ]]
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.22.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - name: Build the selected revision
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/source.sha"
          pnpm build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - run: pnpm exec playwright install --with-deps "$DIAGNOSTIC_BROWSER"
      - name: Run only the selected diagnostic
        timeout-minutes: 30
        shell: bash
        run: |
          set -o pipefail
          pnpm test:diagnose "$DIAGNOSTIC_TEST" --project="$DIAGNOSTIC_BROWSER" --repeat-each="$DIAGNOSTIC_REPEAT" 2>&1 | tee "$RUNNER_TEMP/diagnostic.log"
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-diagnostic
          path: |
            ${{ runner.temp }}/source.sha
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/diagnostic.log
            /tmp/blog-tests/
          retention-days: 7
          if-no-files-found: error
