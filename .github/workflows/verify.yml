name: Verify CMS
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: cms-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: Source, build and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.22.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - name: Check source, build, integration and shard plan
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          pnpm check:base 2>&1 | tee "$RUNNER_TEMP/cms-base.log"
      - name: Package the tested build
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/blog-build.sha"
          tar -czf "$RUNNER_TEMP/blog-build.tar.gz" dist
      - name: Share the tested build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blog-test-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blog-build.sha
            ${{ runner.temp }}/blog-build.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Retain native verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-foundation
          path: |
            ${{ runner.temp }}/cms-base.log
            /tmp/blog-tests/
          retention-days: 7
          if-no-files-found: error

  browser:
    name: Browser (${{ matrix.project }}, ${{ matrix.shard }}/2)
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
        shard: [1, 2]
    env:
      BLOG_TEST_RUN_ID: browser-${{ matrix.project }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.22.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-test-build-${{ github.sha }}
          path: ${{ runner.temp }}/tested-build
      - name: Verify and restore the tested build
        run: |
          test "$(cat "$RUNNER_TEMP/tested-build/blog-build.sha")" = "$(git rev-parse HEAD)"
          tar -xzf "$RUNNER_TEMP/tested-build/blog-build.tar.gz"
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - name: Run the isolated browser shard
        timeout-minutes: 90
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 2>&1 | tee "$RUNNER_TEMP/browser.log"
      - name: Retain shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-browser-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/browser.log
            /tmp/blog-tests/
          retention-days: 7
          if-no-files-found: error

  focused:
    name: ${{ matrix.name }}
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core journeys
            suite: core
            browsers: chromium webkit
            command: pnpm test:core
          - name: Performance measurements
            suite: performance
            browsers: chromium
            command: pnpm test:editor-performance
    env:
      BLOG_TEST_RUN_ID: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.22.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-test-build-${{ github.sha }}
          path: ${{ runner.temp }}/tested-build
      - name: Verify and restore the tested build
        run: |
          test "$(cat "$RUNNER_TEMP/tested-build/blog-build.sha")" = "$(git rev-parse HEAD)"
          tar -xzf "$RUNNER_TEMP/tested-build/blog-build.tar.gz"
      - run: pnpm exec playwright install --with-deps ${{ matrix.browsers }}
      - name: Run the native focused check
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          ${{ matrix.command }} 2>&1 | tee "$RUNNER_TEMP/focused.log"
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/focused.log
            /tmp/blog-tests/
          retention-days: 7
          if-no-files-found: error

  development:
    name: Development server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.22.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check the development server
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          pnpm test:development 2>&1 | tee "$RUNNER_TEMP/development.log"
      - name: Retain development evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-development
          path: |
            ${{ runner.temp }}/development.log
            /tmp/blog-tests/
          retention-days: 7
          if-no-files-found: error

  verify:
    needs: [foundation, browser, focused, development]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          FOCUSED_RESULT: ${{ needs.focused.result }}
          DEVELOPMENT_RESULT: ${{ needs.development.result }}
        run: |
          for result in "$FOUNDATION_RESULT" "$BROWSER_RESULT" "$FOCUSED_RESULT" "$DEVELOPMENT_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::A required verification job did not succeed: $result"
              exit 1
            fi
          done
