name: Verify CMS
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: cms-verify-${{ github.ref }}
  cancel-in-progress: true
env:
  # One absolute temporary root so every job writes and reads the same native
  # proof layout: /tmp/blog-tests/<run id>/proofs.
  TMPDIR: /tmp
  # Identity of this verification run; native reporters bind every proof file to it.
  BLOG_VERIFICATION_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  foundation:
    name: Source, build and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.22.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - name: Check source, build, integration and shard plan
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          pnpm check:base 2>&1 | tee "$RUNNER_TEMP/cms-base.log"
      - name: Package the tested build
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/blog-build.sha"
          tar -czf "$RUNNER_TEMP/blog-build.tar.gz" dist
          # Ship the run manifest beside the build so dependent jobs restore this
          # run's identity instead of preparing a competing one.
          tar -czf "$RUNNER_TEMP/blog-run.tar.gz" \
            -C "/tmp/blog-tests/$BLOG_VERIFICATION_RUN_ID/proofs" run.json
      - name: Share the tested build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blog-test-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blog-build.sha
            ${{ runner.temp }}/blog-build.tar.gz
            ${{ runner.temp }}/blog-run.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Upload the compact proof artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Layer proofs only: the contracts job merges these into the proofs
          # directory instead of downloading browser traces. The layer globs
          # cover both the fixed layer file name and an immutable per-run suffix,
          # so a proof can never be silently replaced by a stale one.
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-proof-foundation
          path: |
            /tmp/blog-tests/${{ env.BLOG_VERIFICATION_RUN_ID }}/proofs/run.json
            /tmp/blog-tests/${{ env.BLOG_VERIFICATION_RUN_ID }}/proofs/unit*.json
            /tmp/blog-tests/${{ env.BLOG_VERIFICATION_RUN_ID }}/proofs/integration*.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain native verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-foundation
          path: |
            ${{ runner.temp }}/cms-base.log
            /tmp/blog-tests/
          retention-days: 7
          if-no-files-found: error

  browser:
    name: Browser (${{ matrix.project }}, ${{ matrix.shard }}/2)
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
        shard: [1, 2]
    env:
      BLOG_TEST_RUN_ID: browser-${{ matrix.project }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.22.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-test-build-${{ github.sha }}
          path: ${{ runner.temp }}/tested-build
      - name: Verify and restore the tested build
        run: |
          test "$(cat "$RUNNER_TEMP/tested-build/blog-build.sha")" = "$(git rev-parse HEAD)"
          tar -xzf "$RUNNER_TEMP/tested-build/blog-build.tar.gz"
      - name: Restore the run metadata
        shell: bash
        run: |
          proofs="/tmp/blog-tests/$BLOG_VERIFICATION_RUN_ID/proofs"
          # Unpacked outside the repository: an untracked run.json would change
          # the source fingerprint this run's proofs are bound to.
          mkdir -p "$RUNNER_TEMP/run-metadata"
          tar -xzf "$RUNNER_TEMP/tested-build/blog-run.tar.gz" -C "$RUNNER_TEMP/run-metadata"
          mkdir -p "$proofs"
          cp "$RUNNER_TEMP/run-metadata/run.json" "$proofs/run.json"
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - name: Run the isolated browser shard
        timeout-minutes: 90
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 2>&1 | tee "$RUNNER_TEMP/browser.log"
      - name: Upload the compact proof artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-proof-browser-${{ matrix.project }}-${{ matrix.shard }}
          path: /tmp/blog-tests/${{ env.BLOG_VERIFICATION_RUN_ID }}/proofs/e2e-*.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-browser-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/browser.log
            /tmp/blog-tests/
          retention-days: 7
          if-no-files-found: error

  performance:
    name: Performance measurements
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BLOG_TEST_RUN_ID: performance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.22.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-test-build-${{ github.sha }}
          path: ${{ runner.temp }}/tested-build
      - name: Verify and restore the tested build
        run: |
          test "$(cat "$RUNNER_TEMP/tested-build/blog-build.sha")" = "$(git rev-parse HEAD)"
          tar -xzf "$RUNNER_TEMP/tested-build/blog-build.tar.gz"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the native performance check
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          pnpm test:editor-performance 2>&1 | tee "$RUNNER_TEMP/performance.log"
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-performance
          path: |
            ${{ runner.temp }}/performance.log
            /tmp/blog-tests/
          retention-days: 7
          if-no-files-found: error

  components:
    name: Component suites
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BLOG_TEST_RUN_ID: components
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.22.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      # The harness builds its own Vite bundle and serves no Worker, so this job
      # restores only the run manifest from the shared build artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-test-build-${{ github.sha }}
          path: ${{ runner.temp }}/tested-build
      - name: Restore the run metadata
        shell: bash
        run: |
          proofs="/tmp/blog-tests/$BLOG_VERIFICATION_RUN_ID/proofs"
          # Unpacked outside the repository: an untracked run.json would change
          # the source fingerprint this run's proofs are bound to.
          mkdir -p "$RUNNER_TEMP/run-metadata"
          tar -xzf "$RUNNER_TEMP/tested-build/blog-run.tar.gz" -C "$RUNNER_TEMP/run-metadata"
          mkdir -p "$proofs"
          cp "$RUNNER_TEMP/run-metadata/run.json" "$proofs/run.json"
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run the isolated component suites
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          pnpm test:components 2>&1 | tee "$RUNNER_TEMP/components.log"
      - name: Upload the compact proof artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-proof-components
          path: /tmp/blog-tests/${{ env.BLOG_VERIFICATION_RUN_ID }}/proofs/component-*.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain component evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-components
          path: |
            ${{ runner.temp }}/components.log
            /tmp/blog-tests/
          retention-days: 7
          if-no-files-found: error

  development:
    name: Development server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.22.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check the development server
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          pnpm test:development 2>&1 | tee "$RUNNER_TEMP/development.log"
      - name: Retain development evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-development
          path: |
            ${{ runner.temp }}/development.log
            /tmp/blog-tests/
          retention-days: 7
          if-no-files-found: error

  contracts:
    name: Contracts
    needs: [foundation, browser, components]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.22.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - name: Download the proof artifacts of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: frontend-${{ github.run_id }}-${{ github.run_attempt }}-proof-*
          path: /tmp/blog-tests/${{ env.BLOG_VERIFICATION_RUN_ID }}/proofs
          merge-multiple: true
      - name: Check the migration contracts
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          pnpm test:contracts 2>&1 | tee "$RUNNER_TEMP/contracts.log"
      - name: Retain contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}-contracts
          path: |
            ${{ runner.temp }}/contracts.log
            /tmp/blog-tests/${{ env.BLOG_VERIFICATION_RUN_ID }}/proofs
          retention-days: 7
          if-no-files-found: error

  verify:
    needs: [foundation, browser, components, contracts, performance, development]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          COMPONENTS_RESULT: ${{ needs.components.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          DEVELOPMENT_RESULT: ${{ needs.development.result }}
        run: |
          status=0
          for entry in \
            foundation="$FOUNDATION_RESULT" \
            browser="$BROWSER_RESULT" \
            components="$COMPONENTS_RESULT" \
            contracts="$CONTRACTS_RESULT" \
            performance="$PERFORMANCE_RESULT" \
            development="$DEVELOPMENT_RESULT"; do
            if [ "${entry#*=}" != success ]; then
              echo "::error::A required verification job did not succeed: ${entry%%=*} (${entry#*=})"
              status=1
            fi
          done
          exit "$status"
